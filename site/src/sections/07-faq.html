<section class="cl-faq" id="faq" data-figma="1695:20379" data-figma-s="1695:19900">
  <header class="cl-faq__head" data-figma="1695:20380" data-figma-s="1695:19902">
    <p class="cl-faq__eyebrow" data-figma="1695:20381" data-figma-s="1695:19903"><span class="cl-faq__eyebrow-dot" aria-hidden="true"></span>FAQ</p>
    <h2 class="cl-faq__title" data-figma="1695:20384" data-figma-s="1695:19906">常見問題</h2>
  </header>

  <div class="cl-faq__body" data-figma="1695:20385" data-figma-s="1695:19908">
    <div class="cl-faq__tabs" role="tablist" aria-label="常見問題分類" data-figma="1695:20386" data-figma-s="1695:19909">
      <button class="cl-faq__tab is-active" type="button" role="tab" id="cl-faq-tab-1" aria-controls="cl-faq-panel-1" aria-selected="true" data-figma="1695:20387" data-figma-s="1695:19910"><span class="cl-faq__tab-dot" aria-hidden="true"></span>預約與到廠</button>
      <button class="cl-faq__tab cl-faq__tab--tall" type="button" role="tab" id="cl-faq-tab-2" aria-controls="cl-faq-panel-2" aria-selected="false" tabindex="-1" data-figma="1695:20390" data-figma-s="1695:19913"><span class="cl-faq__tab-dot" aria-hidden="true"></span>準備與分類</button>
      <button class="cl-faq__tab" type="button" role="tab" id="cl-faq-tab-3" aria-controls="cl-faq-panel-3" aria-selected="false" tabindex="-1" data-figma="1695:20392" data-figma-s="1695:19915"><span class="cl-faq__tab-dot" aria-hidden="true"></span>水銷證明與綠點回饋</button>
    </div>

    <div class="cl-faq__list" role="tabpanel" id="cl-faq-panel-1" aria-labelledby="cl-faq-tab-1" data-figma="1695:20394" data-figma-s="1695:19917">
      <div class="cl-faq__item is-open" data-figma="1695:20395" data-figma-s="1695:19918">
        <button class="cl-faq__q" type="button" aria-expanded="true">
          <span class="cl-faq__num">Q1.</span>
          <span class="cl-faq__question">第一次到廠，怎麼知道怎麼走？</span>
          <span class="cl-faq__icon" aria-hidden="true"><picture class="cl-faq__icon-minus"><source media="(max-width: 640px)" srcset="assets/07-faq/icon-minus-24.svg"><img src="assets/07-faq/icon-minus-32.svg" alt=""></picture><picture class="cl-faq__icon-add"><source media="(max-width: 640px)" srcset="assets/07-faq/icon-add-24.svg"><img src="assets/07-faq/icon-add-32.svg" alt=""></picture></span>
        </button>
        <div class="cl-faq__a"><p class="cl-faq__answer">預約完成頁會提供進場動線圖與到廠注意事項（含警衛室報到、地磅人員登記車號過磅至水銷區流程）。出發前花一分鐘確認，到廠後照圖行進即可。</p></div>
      </div>
      <div class="cl-faq__item" data-figma="1695:20397" data-figma-s="1695:19920">
        <button class="cl-faq__q" type="button" aria-expanded="false">
          <span class="cl-faq__num">Q2.</span>
          <span class="cl-faq__question">臨時決定要銷毀，沒預約可以進場嗎？</span>
          <span class="cl-faq__icon" aria-hidden="true"><picture class="cl-faq__icon-minus"><source media="(max-width: 640px)" srcset="assets/07-faq/icon-minus-24.svg"><img src="assets/07-faq/icon-minus-32.svg" alt=""></picture><picture class="cl-faq__icon-add"><source media="(max-width: 640px)" srcset="assets/07-faq/icon-add-24.svg"><img src="assets/07-faq/icon-add-32.svg" alt=""></picture></span>
        </button>
        <div class="cl-faq__a"><p class="cl-faq__answer">為確保廠區作業安全與過磅效率，本服務全面採用線上預約制。請先於平台完成預約並取得預約編號後再行前往。</p></div>
      </div>
      <div class="cl-faq__item" data-figma="1695:20399" data-figma-s="1695:19922">
        <button class="cl-faq__q" type="button" aria-expanded="false">
          <span class="cl-faq__num">Q3.</span>
          <span class="cl-faq__question">預約時還不確定到場車號，怎麼辦？</span>
          <span class="cl-faq__icon" aria-hidden="true"><picture class="cl-faq__icon-minus"><source media="(max-width: 640px)" srcset="assets/07-faq/icon-minus-24.svg"><img src="assets/07-faq/icon-minus-32.svg" alt=""></picture><picture class="cl-faq__icon-add"><source media="(max-width: 640px)" srcset="assets/07-faq/icon-add-24.svg"><img src="assets/07-faq/icon-add-32.svg" alt=""></picture></span>
        </button>
        <div class="cl-faq__a"><p class="cl-faq__answer">線上預約時無需填寫車號。車輛抵達廠區報到時，將由現場地磅人員直接於系統核對預約資訊並登記車號過磅，方便您彈性調配運送車輛。</p></div>
      </div>
      <div class="cl-faq__item" data-figma="1695:20401" data-figma-s="1695:19924">
        <button class="cl-faq__q" type="button" aria-expanded="false">
          <span class="cl-faq__num">Q4.</span>
          <span class="cl-faq__question">水銷服務要收費嗎？</span>
          <span class="cl-faq__icon" aria-hidden="true"><picture class="cl-faq__icon-minus"><source media="(max-width: 640px)" srcset="assets/07-faq/icon-minus-24.svg"><img src="assets/07-faq/icon-minus-32.svg" alt=""></picture><picture class="cl-faq__icon-add"><source media="(max-width: 640px)" srcset="assets/07-faq/icon-add-24.svg"><img src="assets/07-faq/icon-add-32.svg" alt=""></picture></span>
        </button>
        <div class="cl-faq__a"><p class="cl-faq__answer">本服務為正隆免費提供之機密文件水銷處理服務，不收取任何處理費或手續費。</p></div>
      </div>
      <div class="cl-faq__item" data-figma="1695:20403" data-figma-s="1695:19926">
        <button class="cl-faq__q" type="button" aria-expanded="false">
          <span class="cl-faq__num">Q5.</span>
          <span class="cl-faq__question">一次要送多少量才能預約？</span>
          <span class="cl-faq__icon" aria-hidden="true"><picture class="cl-faq__icon-minus"><source media="(max-width: 640px)" srcset="assets/07-faq/icon-minus-24.svg"><img src="assets/07-faq/icon-minus-32.svg" alt=""></picture><picture class="cl-faq__icon-add"><source media="(max-width: 640px)" srcset="assets/07-faq/icon-add-24.svg"><img src="assets/07-faq/icon-add-32.svg" alt=""></picture></span>
        </button>
        <div class="cl-faq__a"><p class="cl-faq__answer">本服務未設定單次最小送銷重量限制，歡迎透過系統預約到廠銷毀。</p></div>
      </div>
    </div>
