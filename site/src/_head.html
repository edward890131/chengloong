<!-- 進場載入畫面（R2 客戶）：預先下載圖片與 Lottie，進度條顯示已下載百分比（依位元組計算）。
     清單由 build.py 掃 index.html／draft.css 產生（CL_PRELOAD）；載完後畫面往上收起，main.js 才開始跑頁面動態 -->
<div class="cl-loader" id="cl-loader" role="progressbar" aria-label="網頁載入中" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="cl-loader__inner">
    <span class="cl-hero__logo cl-loader__logo" aria-hidden="true">
      <span class="cl-hero__logo-mark"><img src="assets/01-hero/logo-mark.svg" alt=""></span>
      <span class="cl-hero__logo-zh"><img src="assets/01-hero/logo-zh.svg" alt=""></span>
      <span class="cl-hero__logo-en"><img src="assets/01-hero/logo-en.svg" alt=""></span>
    </span>
    <span class="cl-loader__pct"><span class="cl-loader__num">0</span><span class="cl-loader__unit">%</span></span>
    <span class="cl-loader__bar"><span class="cl-loader__fill"></span></span>
    <span class="cl-loader__label">載入中</span>
  </div>
</div>
<script>
/* 進場載入：清單逐一 fetch（同時 6 個，照頁面順序＝首屏先），用串流讀取累計位元組算百分比；
   顯示值平滑追上實際值、不倒退。最少顯示 0.6s、最多等 15s（逾時直接進站，剩下的背景繼續下載）。
   ?static 或瀏覽器不支援 fetch 串流時改用 Image 計件。完成後呼叫 window.clWhenReady 排隊的函式（main.js 整包） */
(function () {
  var d = document.documentElement, el = document.getElementById('cl-loader');
  var queue = [], ready = false;
  window.clWhenReady = function (fn) { if (ready) fn(); else queue.push(fn); };
  function boot() { if (ready) return; ready = true; d.classList.remove('is-loading'); queue.splice(0).forEach(function (fn) { fn(); }); }
  if (d.classList.contains('is-static') || !el) { if (el) el.remove(); boot(); return; }
  d.classList.add('is-loading');

  var LIST = /*CL_PRELOAD*/[];
  var MIN = 600, MAX = 15000, CONC = 6, t0 = performance.now();
  var total = 0, got = {}, done = 0, finished = false;
  LIST.forEach(function (it) { total += it[1]; });
  var fill = el.querySelector('.cl-loader__fill'), pct = el.querySelector('.cl-loader__num');
  function loadedBytes() { var n = 0; for (var k in got) n += got[k]; return n; }
  function settle(i) { got[i] = LIST[i][1]; done++; next(); }
  var idx = 0, canStream = !!(window.fetch && window.ReadableStream && window.TextDecoder);
  function next() {
    if (idx >= LIST.length) return;
    var i = idx++, url = LIST[i][0];
    if (!canStream) {
      var im = new Image(); im.onload = im.onerror = function () { settle(i); }; im.src = url; return;
    }
    fetch(url).then(function (res) {
      if (!res.ok || !res.body) { settle(i); return; }
      var reader = res.body.getReader(), n = 0;
      return (function pump() {
        return reader.read().then(function (r) {
          if (r.done) { settle(i); return; }
          n += r.value.length; got[i] = Math.min(n, LIST[i][1]);
          return pump();
        });
      })();
    }).catch(function () { settle(i); });
  }
  for (var c = 0; c < CONC; c++) next();

  var shown = 0;
  (function frame(now) {
    var real = total ? loadedBytes() / total * 100 : 100;
    var all = done >= LIST.length, late = now - t0 > MAX;
    var target = all || late ? 100 : Math.min(99, real);
    shown += Math.max((target - shown) * .08, target > shown ? .15 : 0);
    if (shown > target) shown = target;
    var v = Math.floor(shown);
    fill.style.transform = 'scaleX(' + (shown / 100) + ')';
    pct.textContent = v;
    el.setAttribute('aria-valuenow', v);
    if (shown >= 100 && now - t0 >= MIN) return leave();
    requestAnimationFrame(frame);
  })(t0);

  function leave() {
    if (finished) return; finished = true;
    setTimeout(function () {
      el.classList.add('is-done');
      boot();   // 頁面動態跟著載入畫面收起一起開始
      setTimeout(function () { el.remove(); }, 1000);
    }, 250);
  }
})();
</script>
